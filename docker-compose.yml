#============== MIH Network ====================================================================
networks:
  mih-network:
    driver: bridge

#============== MIH Containers ====================================================================
services:
  #============== Nginx Proxy Manager ====================================================================
  mih-nginx:
    container_name: mih-nginx
    image: "jc21/nginx-proxy-manager:latest"
    restart: unless-stopped
    ports:
      - "80:80" # Public HTTP
      - "443:443" # Public HTTPS
      - "127.0.0.1:81:81" # Admin Web Port
    volumes:
      - ./mih_nginx/data:/data
      - ./mih_nginx/letsencrypt:/etc/letsencrypt
    networks:
      - mih-network

  #============== MIH HTML Website ====================================================================
  mih-web:
    container_name: mih-web
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./taylor_electrical_website:/usr/share/nginx/html
    networks:
      - mih-network

  #============== MIH File Browser ====================================================================
  mih-filebrowser:
    container_name: mih-filebrowser
    image: filebrowser/filebrowser:v2.30.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./taylor_electrical_website:/srv
      - ./mih_filebrowser/filebrowser.db:/database.db
    networks:
      - mih-network

  #============== MIH-Monitor Portainer ====================================================================
  mih-monitor:
    container_name: mih-monitor
    image: portainer/portainer-ce:2.20.3
    ports:
      - "127.0.0.1:9444:9443"
    volumes:
      - ./mih_monitor/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - mih-network
